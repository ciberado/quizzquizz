services:
  quizzquizz:
    build:
      context: .
      dockerfile: Dockerfile
    image: quizzquizz:latest
    container_name: quizzquizz
    # No ports exposed externally - accessed through Caddy reverse proxy
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/data/quiz.db
      - QUESTION_BANKS_PATH=/app/question-banks
      - SESSION_EXPIRY_HOURS=24
      - LOG_LEVEL=info
    volumes:
      # Persist SQLite database
      - quiz-data:/data
      # Share built frontend files with Caddy
      - app-dist:/app/packages
      # Mount custom question banks (optional - uncomment and modify path)
      # - ./question-banks:/app/question-banks:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - quizzquizz-network

  caddy:
    image: caddy:2-alpine
    container_name: quizzquizz-caddy
    ports:
      - "3000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Access frontend dist files from quizzquizz container (read-only)
      - app-dist:/app/packages:ro
    restart: unless-stopped
    depends_on:
      - quizzquizz
    networks:
      - quizzquizz-network

volumes:
  quiz-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  app-dist:
    driver: local

networks:
  quizzquizz-network:
    driver: bridge
